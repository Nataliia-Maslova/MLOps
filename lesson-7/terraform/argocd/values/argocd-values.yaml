configs:
  cm:
    timeout.reconciliation: 30s

server:
  service:
    type: ClusterIP
  extraArgs:
    - --insecure
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi

controller:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

redis:
  enabled: true