stages:
  - train
  - build
  - deploy

variables:
  IMAGE: nataliiamaslova/aiops-app

retrain:
  stage: train
  image: python:3.10
  script:
    - pip install scikit-learn numpy
    - python model/train.py
  artifacts:
    paths:
      - model_artifacts/model.pkl

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  script:
    - sed -i "s/tag:.*/tag: $CI_COMMIT_SHORT_SHA/" helm/values.yaml
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "CI"
    - git add helm/values.yaml
    - git commit -m "update image"
    - git push