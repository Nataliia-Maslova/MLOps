apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-app
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  source:
    repoURL: https://github.com/Nataliia-Maslova/aiops-quality-project.git
    targetRevision: HEAD
    path: helm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true